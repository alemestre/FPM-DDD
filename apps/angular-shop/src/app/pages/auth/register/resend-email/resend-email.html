  @switch (resendStatus()) {
    @case ('sent') {
      <div class="alert alert-success small text-start text-center" role="status">
        Un nouveau lien vient de vous être envoyé.
      </div>
    }
    @case ('failed') {
      <div class="alert alert-danger small text-start" role="alert">
        L'envoi a échoué. Veuillez réessayer.
      </div>
    }
  }

  @if(displayLoginButton()) {
    <a class="btn btn-primary rounded-pill fw-medium w-100 py-2" routerLink="/login">Se connecter</a>
  }

  <button
    type="button"
    class="btn btn-link btn-sm mt-2"
    [disabled]="resendStatus() === 'sending'"
    (click)="resendVerificationEmail()"
  >
    Je n'ai rien reçu, renvoyer l'e-mail
  </button>
