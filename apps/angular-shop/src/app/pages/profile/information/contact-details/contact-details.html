    <!-- Coordonnées -->
      <div class="card border-0 shadow-sm rounded-4 h-100">
        <div
          class="card-header bg-transparent border-0 pt-4 px-4 d-flex justify-content-between align-items-center"
        >
          <h2 class="h5 fw-semibold text-secondary mb-0">Coordonnées</h2>
          @if (!editingInfo()) {
            <button
              (click)="onEdit()"
              class="btn btn-outline-primary btn-sm rounded-pill px-3"
              type="button"
            >
              <i aria-hidden="true" class="bi bi-pencil me-1"></i>Modifier
            </button>
          }
        </div>

        <div class="card-body p-4">
          @if (!editingInfo()) {
            <!-- Mode lecture -->
            <app-read-only [profile]="profile()" />
          } @else {
            <app-edit [profile]="profile()" [(editingInfo)]="editingInfo" />
          }
        </div>
      </div>
