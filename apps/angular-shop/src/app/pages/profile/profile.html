@if (profile(); as profile) {
  <section class="container py-4 py-lg-5">
    <!-- En-tête du profil -->
    <app-top-bar [profile]="profile"/>

    <!-- Onglets -->
    <ul
      #nav="ngbNav"
      [(activeId)]="activeTab"
      class="nav-pills gap-2 mb-4 flex-nowrap overflow-x-auto"
      ngbNav
    >
      <!-- ============ Onglet : Mes informations ============ -->
      <li ngbNavItem="informations">
        <!-- Le bouton et le ng-template doivent rester ici : ngbNavItem ne les trouve pas dans un composant enfant. -->
        <button class="rounded-pill px-4 text-nowrap" ngbNavLink type="button">
          <i aria-hidden="true" class="bi bi-person-vcard me-2"></i>Mes informations
        </button>
        <ng-template ngbNavContent>
          <app-customer-information [profile]="profile"/>
        </ng-template>
      </li>

      <!-- ============ Onglet : Mes commandes ============ -->
      <li ngbNavItem="commandes">
        <button class="rounded-pill px-4 text-nowrap" ngbNavLink type="button">
          <i aria-hidden="true" class="bi bi-bag me-2"></i>Mes commandes
          @if (currentOrdersCount()) {
          <span class="badge rounded-pill text-bg-light text-primary ms-1"
          >{{ currentOrdersCount() }}</span>
        }
        </button>
        <ng-template ngbNavContent>
           <app-customer-orders
            [orders]="orders()"
            [isLoading]="ordersResource.isLoading()"
            [hasError]="hasOrdersError()"
            (retry)="ordersResource.reload()"
          />
        </ng-template>
      </li>
    </ul>

    <div [ngbNavOutlet]="nav"></div>
    </section>
  } @else {
    <div class="d-flex justify-content-center py-5">
      <span class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Chargement du profil…</span>
      </span>
    </div>
  }
