@if (isLoading()) {
<div class="d-flex justify-content-center mt-4">
    <div class="spinner-border text-primary" role="status"></div>
</div>
} @else {
<section class="container py-4">
    @if (hasProducts()) {
    <div class="row mb-4">
        <div class="col-md-8 col-lg-6 mx-auto">
            <app-search-bar [(query)]="searchTerm" />
        </div>
    </div>

    @if (filteredProducts().length > 0) {
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4 pt-3">
        @for (product of filteredProducts(); track product.id) {
        <div class="col">
            <app-product-card (addToCart)="onAddToCart($event)" [product]="product" />
        </div>
        }
    </div>
    } @else {
    <p class="text-body-secondary text-center py-5 mb-0">
        <i class="bi bi-search d-block fs-1 mb-2" aria-hidden="true"></i>
        Aucun produit ne correspond à votre recherche.
    </p>
    } } @else {
    <p class="text-body-secondary text-center py-5 mb-0">
        <i class="bi bi-basket d-block fs-1 mb-2" aria-hidden="true"></i>
        Aucun produit.
    </p>
    }
</section>
}
