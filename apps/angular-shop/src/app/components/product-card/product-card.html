<article class="card h-100 border-0 shadow-sm overflow-hidden">
    <div class="ratio ratio-4x3 bg-body-tertiary">
        @if (imageUrl(); as src) {
        <img [src]="src" [alt]="product().name" class="card-img-top object-fit-cover" loading="lazy" />
        } @else {
        <div
            class="d-flex align-items-center justify-content-center text-secondary opacity-50"
            role="img"
            [attr.aria-label]="'Pas de photo pour ' + product().name"
        >
            <i class="bi bi-image fs-1" aria-hidden="true"></i>
        </div>
        }
    </div>

    <div class="card-body d-flex flex-column gap-1">
        <h3 class="card-title h6 fw-bold text-secondary mb-0">{{ product().name }}</h3>
        <p class="card-subtitle small text-body-secondary mb-0 d-flex align-items-center gap-1">
            <i class="bi bi-shop" aria-hidden="true"></i>
            <span>{{ product().producer.name }}</span>
        </p>

        @if (quantity(); as quantity) {
        <p class="small text-body-secondary mb-0">{{ quantity }}</p>
        }

        <p class="fs-5 fw-bold text-primary mt-auto mb-0 pt-2">
            {{ price() }}
            <span class="fs-6 fw-normal text-body-secondary">/ {{ unit() }}</span>
        </p>
    </div>

    <div class="card-footer bg-transparent border-0 pt-0 pb-3 px-3">
        <button
            type="button"
            class="btn btn-primary w-100 d-inline-flex align-items-center justify-content-center gap-2"
            [disabled]="isOutOfStock()"
            (click)="onAddToCart()"
        >
            @if (isOutOfStock()) {
            Rupture de stock
            } @else {
            <i class="bi bi-cart-plus" aria-hidden="true"></i>
            Ajouter au panier
            }
        </button>
    </div>
</article>
