<div class="d-flex min-vh-100 bg-body-tertiary">
    <!-- Sidebar : colonne fixe à partir de lg, offcanvas en dessous -->
    <div class="bg-secondary flex-shrink-0">
        <aside
            id="admin-sidebar"
            class="offcanvas-lg offcanvas-start text-bg-secondary sticky-lg-top vh-100 d-flex flex-column"
            [class.show]="sidebarOpen()"
            style="--bs-offcanvas-width: 260px; width: 260px"
            aria-label="Navigation de l'administration"
        >
            <div class="d-flex align-items-center justify-content-between p-3 border-bottom border-light border-opacity-25">
                <a class="d-flex align-items-center gap-2 text-white text-decoration-none" routerLink="/admin" (click)="closeSidebar()">
                    <img src="./images/logo_white.png" alt="Logo de l'application" height="36" />
                    <span class="fw-semibold">Administration</span>
                </a>
                <button type="button" class="btn-close btn-close-white d-lg-none" aria-label="Fermer le menu" (click)="closeSidebar()"></button>
            </div>

            <nav class="flex-grow-1 overflow-y-auto p-3">
                <ul class="nav nav-pills flex-column gap-1">
                    @for (item of navItems; track item.link) {
                    <li class="nav-item">
                        <a
                            class="nav-link text-white d-flex align-items-center gap-3"
                            [routerLink]="item.link"
                            routerLinkActive="active bg-primary"
                            ariaCurrentWhenActive="page"
                            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                            (click)="closeSidebar()"
                        >
                            <i class="bi {{ item.icon }} fs-5" aria-hidden="true"></i>
                            {{ item.label }}
                        </a>
                    </li>
                    }
                </ul>
            </nav>

            <div class="p-3 border-top border-light border-opacity-25">
                @if (authService.currentUser(); as user) {
                <div class="d-flex align-items-center gap-2 small text-white-50 mb-2">
                    <i class="bi bi-person-circle fs-5" aria-hidden="true"></i>
                    {{ user.firstName }} {{ user.lastName }}
                </div>
                }
                <button
                    type="button"
                    class="btn btn-outline-light w-100 d-flex align-items-center justify-content-center gap-2"
                    (click)="logout()"
                >
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                    Déconnexion
                </button>
            </div>
        </aside>
    </div>

    @if (sidebarOpen()) {
    <!-- Fond cliquable ; au clavier, Échap ou le bouton de fermeture ferment le menu -->
    <button type="button" class="offcanvas-backdrop fade show d-lg-none border-0 p-0" tabindex="-1" aria-label="Fermer le menu" (click)="closeSidebar()"></button>
    }

    <!-- min-width: 0 laisse le contenu rétrécir (tables larges) au lieu d'élargir la page -->
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0">
        <!-- Barre mobile -->
        <header class="navbar bg-white shadow-sm d-lg-none px-3">
            <button
                type="button"
                class="btn btn-outline-secondary"
                aria-controls="admin-sidebar"
                [attr.aria-expanded]="sidebarOpen()"
                aria-label="Ouvrir le menu"
                (click)="openSidebar()"
            >
                <i class="bi bi-list fs-5" aria-hidden="true"></i>
            </button>
            <span class="fw-semibold">Administration</span>
        </header>

        <main class="flex-grow-1 p-3 p-lg-4">
            <router-outlet />
        </main>
    </div>
</div>
