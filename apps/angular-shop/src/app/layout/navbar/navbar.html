<nav class="navbar navbar-expand-lg sticky-top app-navbar" aria-label="Navigation principale">
    <div class="d-flex flex-wrap align-items-center container-fluid">
        <a class="navbar-brand app-brand" routerLink="/home" (click)="isMenuCollapsed = true">
            La Ferme du Petit Marais
        </a>

        <button
            class="navbar-toggler"
            type="button"
            aria-controls="main-navbar"
            aria-label="Ouvrir ou fermer le menu"
            [attr.aria-expanded]="!isMenuCollapsed"
            (click)="isMenuCollapsed = !isMenuCollapsed"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="navbar-collapse" id="main-navbar" [ngbCollapse]="isMenuCollapsed">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a
                        class="nav-link"
                        routerLink="/home"
                        routerLinkActive="active"
                        ariaCurrentWhenActive="page"
                        (click)="isMenuCollapsed = true"
                    >
                        Accueil
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        routerLink="/about"
                        routerLinkActive="active"
                        ariaCurrentWhenActive="page"
                        (click)="isMenuCollapsed = true"
                    >
                        À propos
                    </a>
                </li>

                <li class="nav-item" ngbDropdown display="static" routerLinkActive="active">
                    <button class="nav-link" type="button" ngbDropdownToggle>Produits</button>
                    <!-- Catégories d'exemple : à remplacer par les données de l'API. -->
                    <ul ngbDropdownMenu>
                      @for (category of categories(); track category.id) {
                        <li>
                            <a
                                ngbDropdownItem
                                [routerLink]="['produits', category.id]"
                                routerLinkActive="active"
                                (click)="isMenuCollapsed = true"
                            >
                                {{ category.name }}
                            </a>
                        </li>
                      }
                    </ul>
                </li>
            </ul>

            <!-- Visible que l'utilisateur soit connecté ou non. -->
            <ul class="navbar-nav app-cart-nav">
                <li class="nav-item">
                    <a
                        class="nav-link app-cart"
                        routerLink="/panier"
                        routerLinkActive="active"
                        ariaCurrentWhenActive="page"
                        (click)="isMenuCollapsed = true"
                    >
                        <i class="bi bi-cart3" aria-hidden="true"></i>
                        Votre panier
                        <span class="badge rounded-pill app-cart-badge">
                            {{ cartItemCount() }}
                            <span class="visually-hidden">
                                {{ cartItemCount() > 1 ? 'articles' : 'article' }}
                            </span>
                        </span>
                    </a>
                </li>
            </ul>

            <!-- Bloc à afficher uniquement si l'utilisateur n'est PAS connecté. -->
            <div class="app-auth-actions">
                <a class="btn app-btn-link" routerLink="/login" (click)="isMenuCollapsed = true"
                    >S'identifier</a
                >
                <a
                    class="btn app-btn-primary"
                    routerLink="/register"
                    (click)="isMenuCollapsed = true"
                    >Créer un compte</a
                >
            </div>

            <!-- Bloc à afficher uniquement si l'utilisateur est connecté. -->
            <ul class="navbar-nav app-profile">
                <li class="nav-item" ngbDropdown display="static">
                    <button
                        class="nav-link app-profile-toggle"
                        type="button"
                        aria-label="Mon compte"
                        ngbDropdownToggle
                    >
                        <i class="bi bi-person-circle" aria-hidden="true"></i>
                    </button>
                    <ul class="dropdown-menu-end" ngbDropdownMenu>
                        <li>
                            <a
                                ngbDropdownItem
                                routerLink="/profil"
                                (click)="isMenuCollapsed = true"
                            >
                                <i class="bi bi-person" aria-hidden="true"></i>
                                Mon profil
                            </a>
                        </li>
                        <li><hr class="dropdown-divider" /></li>
                        <li>
                            <!-- L'action de déconnexion reste à brancher. -->
                            <button ngbDropdownItem type="button">
                                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                                Se déconnecter
                            </button>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
