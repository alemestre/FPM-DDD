name: fpm

services:
  db:
    image: postgres
    restart: always
    container_name: postgres
    env_file:
      - ../.env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS="-E 'utf8'"
      - POSTGRES_DB=fpm_dev
    volumes:
      - /srv/fpm/tools/db/main.sql:/docker-entrypoint-initdb.d/main.sql
      - /srv/fpm/volumes/databases/${POSTGRES_DB}/data:/var/lib/postgresql/data
    ports:
        - "127.0.0.1:5432:5432"
    networks:
        - fpm

  # Captures every email sent in dev (SMTP on 1025) and shows it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: always
    container_name: mailpit
    ports:
        - "127.0.0.1:1025:1025"
        - "127.0.0.1:8025:8025"
    networks:
        - fpm

networks:
    fpm:
      external: true
